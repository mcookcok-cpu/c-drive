<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - {{ app_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 15%, #ffd9c2 0%, rgba(255,217,194,0) 42%),
      radial-gradient(circle at 85% 12%, #c6f3e6 0%, rgba(198,243,230,0) 45%),
      radial-gradient(circle at 90% 80%, #d6c9f7 0%, rgba(214,201,247,0) 45%),
      radial-gradient(circle at 10% 88%, #bfe3ff 0%, rgba(191,227,255,0) 45%),
      #f4f1ea;
  }

  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  /* Bola kaca 3D ambient, meniru gimmick "Liquid Glass": tiap bola punya
     highlight terang di kiri-atas (sumber cahaya), badan gradasi warna,
     bayangan gelap tipis di kanan-bawah, lalu drop-shadow lembut di
     "lantai" supaya kelihatan melayang & punya volume, bukan flat blob. */
  .blob{
    position:absolute;
    border-radius:50%;
    z-index:0;
  }
  .blob::after{
    content:"";
    position:absolute;
    top:10%;
    left:14%;
    width:38%;
    height:32%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
    filter:blur(2px);
  }

  .blob.b1{
    width:220px; height:220px; top:8%; left:8%;
    background:
      radial-gradient(circle at 30% 28%, #ded4ff 0%, #9a86f7 34%, #6a58e0 68%, #4834b0 100%);
    box-shadow:
      inset -14px -18px 30px rgba(35,20,90,.45),
      inset 10px 10px 18px rgba(255,255,255,.35),
      0 30px 40px -12px rgba(107,88,224,.55);
    opacity:.92;
  }
  .blob.b2{
    width:190px; height:190px; bottom:9%; right:9%;
    background:
      radial-gradient(circle at 32% 30%, #dcfff5 0%, #6fe3c6 34%, #34b79b 68%, #1c8a75 100%);
    box-shadow:
      inset -12px -16px 26px rgba(10,60,50,.4),
      inset 8px 8px 16px rgba(255,255,255,.4),
      0 26px 36px -12px rgba(52,183,155,.5);
    opacity:.9;
  }
  .blob.b3{
    width:150px; height:150px; bottom:16%; left:13%;
    background:
      radial-gradient(circle at 32% 30%, #ffe4d2 0%, #ffb18c 34%, #f4855a 68%, #d95f34 100%);
    box-shadow:
      inset -10px -14px 22px rgba(120,40,10,.35),
      inset 6px 6px 14px rgba(255,255,255,.4),
      0 22px 30px -10px rgba(244,133,90,.5);
    opacity:.85;
  }

  .blob-glow{
    position:absolute;
    border-radius:50%;
    filter:blur(40px);
    z-index:-1;
    opacity:.55;
  }
  .blob1-glow{ width:220px; height:220px; top:8%; left:8%; background:#7b6ef6; }
  .blob2-glow{ width:190px; height:190px; bottom:9%; right:9%; background:#5ee6c8; }
  .blob3-glow{ width:150px; height:150px; bottom:16%; left:13%; background:#ffb18c; }

  .login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.6);
    border-radius:28px;
    padding:38px 32px;
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 8px 32px rgba(31,38,135,.18),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  .wordmark{
    text-align:center;
    margin:0 0 6px;
  }
  .wordmark .brand{
    display:block;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    letter-spacing:.5px;
    line-height:1.15;
    background:linear-gradient(135deg,#8b7bf7 0%, #6a58e0 42%, #5ee6c8 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .wordmark .rule{
    width:40px;
    height:1px;
    margin:10px auto 0;
    background:linear-gradient(90deg, rgba(139,123,247,0), rgba(139,123,247,.6), rgba(94,230,200,.6), rgba(94,230,200,0));
  }

  .login-card p.sub{
    text-align:center;
    color:#5a5a63;
    margin:14px 0 26px;
    font-size:13.5px;
  }

  .login-field{
    margin-bottom:16px;
  }

  .login-field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:#4a4a52;
    margin-bottom:6px;
    padding-left:4px;
  }

  .login-field .field-shell{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.8);
    border-radius:16px;
    padding:12px 16px;
    box-shadow:inset 0 1px 2px rgba(255,255,255,.6);
    transition:box-shadow .2s ease, border-color .2s ease;
  }

  .login-field .field-shell i{
    color:#7b6ef6;
    font-size:15px;
  }

  .login-field .field-shell:focus-within{
    border-color:#8b7bf7;
    box-shadow:0 0 0 3px rgba(139,123,247,.25);
  }

  .login-field input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-size:15px;
    color:#2b2b31;
  }
  .login-field input:focus{ outline:none; }
  .login-field input::placeholder{ color:#8a8a92; }

  .login-error{
    background:rgba(255,138,128,.25);
    border:1px solid rgba(255,138,128,.5);
    color:#a3231a;
    border-radius:14px;
    padding:10px 14px;
    font-size:13px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:8px;
    backdrop-filter:blur(8px);
  }

  .login-btn{
    position:relative;
    width:100%;
    padding:13px 12px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:999px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(135deg, rgba(139,123,247,.55), rgba(94,230,200,.55));
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -6px 10px rgba(60,40,140,.2),
      0 8px 20px rgba(123,110,246,.35);
    text-shadow:0 1px 2px rgba(60,40,140,.25);
    overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .login-btn::after{
    content:"";
    position:absolute;
    top:0; left:8%;
    width:84%;
    height:1px;
    background:rgba(255,255,255,.8);
    filter:blur(.5px);
  }
  .login-btn:hover{
    transform:translateY(-1px);
    background:
      linear-gradient(160deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(135deg, rgba(139,123,247,.7), rgba(94,230,200,.7));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -6px 10px rgba(60,40,140,.22),
      0 10px 24px rgba(123,110,246,.45);
  }
  .login-btn:active{
    transform:translateY(0);
  }

  @media (prefers-reduced-motion:no-preference){
    .login-card{ animation:cardIn .4s ease; }
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="blob-glow blob1-glow"></div>
  <div class="blob-glow blob2-glow"></div>
  <div class="blob-glow blob3-glow"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="login-card">
    <div class="wordmark">
      <span class="brand">{{ app_name }}</span>
      <div class="rule"></div>
    </div>
    <p class="sub">Masuk untuk melanjutkan</p>

    {% if error %}
    <div class="login-error"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="login-field">
        <label for="username">Username</label>
        <div class="field-shell">
          <i class="bi bi-person"></i>
          <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required autofocus>
        </div>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <div class="field-shell">
          <i class="bi bi-lock"></i>
          <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="login-btn">Masuk</button>
    </form>
  </div>
</div>

</body>
</html>
